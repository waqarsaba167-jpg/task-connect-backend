<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Connect</title>
    <style>
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ffffff;
        }
        .balance-card {
            background-color: #1b263b;
            padding: 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .section-title {
            color: #38bdf8;
            font-size: 22px;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .task-card {
            background-color: #1b263b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .task-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
        }
        .task-desc {
            font-size: 14px;
            color: #94a3b8;
            margin: 5px 0 10px 0;
        }
        .task-btn {
            background-color: #38bdf8;
            color: #0d1b2a;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Task Connect</h1>

    <div class="balance-card">
        Aapka Balance: <span id="balance">0</span> Coins
    </div>

    <div class="section-title">Available Tasks</div>
    <div id="tasks-container">
        <p>Tasks load ho rahe hain...</p>
    </div>

    <script>
        async function fetchTasks() {
            try {
                const response = await fetch('/api/tasks');
                const tasks = await response.json();
                
                const container = document.getElementById('tasks-container');
                container.innerHTML = '';

                if (tasks.length === 0) {
                    container.innerHTML = '<p>Koi task mojood nahi hai.</p>';
                    return;
                }

                tasks.forEach(task => {
                    const taskDiv = document.createElement('div');
                    taskDiv.className = 'task-card';
                    taskDiv.innerHTML = `
                        <div class="task-title">${task.title} (+${task.reward} Coins)</div>
                        <div class="task-desc">${task.description || ''}</div>
                        <button class="task-btn" onclick="window.open('${task.link}', '_blank')">Start Task</button>
                    `;
                    container.appendChild(taskDiv);
                });
            } catch (error) {
                console.error('Error fetching tasks:', error);
                document.getElementById('tasks-container').innerHTML = '<p>Tasks load karne mein masla aaya hai.</p>';
            }
        }

        fetchTasks();
    </script>
</body>
</html>
