<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Connect Global</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div style="padding: 20px; padding-bottom: 80px;">
        <h2 style="color: #00ffff; text-align: center; text-shadow: 0 0 10px #00ffff;">TASK CONNECT GLOBAL</h2>
        
        <div class="neon-box">
            <h3>Welcome, User</h3>
            <p style="color: #00ffff;">Status: ACTIVE</p>
        </div>

        <div class="neon-box">
            <h4>DASHBOARD STATS</h4>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
                <div style="border: 1px solid #ff00ff; padding: 10px; border-radius: 8px;">
                    <i class="fas fa-tasks" style="color: #00ffff; font-size: 20px;"></i>
                    <div style="font-size: 18px; font-weight: bold;">500</div>
                    <div style="font-size: 10px; color: #aaa;">TOTAL TASKS</div>
                </div>
                <div style="border: 1px solid #ff00ff; padding: 10px; border-radius: 8px;">
                    <i class="fas fa-users" style="color: #00ffff; font-size: 20px;"></i>
                    <div style="font-size: 18px; font-weight: bold;">350</div>
                    <div style="font-size: 10px; color: #aaa;">ACTIVE USERS</div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html">
            <i class="fas fa-home"></i> Home
        </a>
        <a href="tasks.html">
            <i class="fas fa-tasks"></i> Tasks
        </a>
        <a href="wallet.html">
            <i class="fas fa-wallet"></i> Wallet
        </a>
        <a href="admin.html">
            <i class="fas fa-user-shield"></i> Admin
        </a>
    </div>

</body>
      </html>
